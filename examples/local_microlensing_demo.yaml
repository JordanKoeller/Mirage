LensingSystem_MicrolensingLens:
  Quasar:
    Redshift: 1.69
    Mass: 1e9 solMass
  Redshift: 0.04
  Cosmology: WMAP7
  Convergence: 0.3
  Shear: 0.0
  StarryFraction: 0.40
Starfield:
  InitialMassFunction: Kroupa2001
  Seed: 110
LensedImageCenter: [0.0, 0.0, 'uas']
RayCount: 40_000_000
SourceRegionDimensions: [100, 100, 'uas']
Reducers:
  - LensedImageReducer:
      Name: img
      Radius: 2 uas
      Query: ['${x_pos}', '${y_pos}', 'uas']
      Resolution: [800, 800, '']
Variants:
  - LinspaceVariant:
      Name: x_pos
      Start: -20
      Stop: 20
      NumPoints: 36
      Tag: coord
  - LinspaceVariant:
      Name: y_pos
      Start: -36
      Stop: 36
      NumPoints: 36
      Tag: coord
