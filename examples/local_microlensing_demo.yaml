LensingSystem_MicrolensingLens:
  Quasar:
    Redshift: 1.69
    Mass: 1e9 solMass
  Redshift: 0.04
  Cosmology: WMAP7
  Convergence: 0.3
  Shear: 0.0
  StarryFraction: ${star_fraction}
Starfield:
  InitialMassFunction: Kroupa2001
  Seed: 110
LensedImageCenter: [0.0, 0.0, 'uas']
RayCount: 1_000
SourceRegionDimensions: [60, 60, 'uas']
Reducers:
  - MagnificationMapReducer:
      Name: magmap
      Radius: 0.2 uas
      Resolution: [100, 100, '']

Variants:
  - ListVariant:
      Name: star_fraction
      Values: [0.2, 0.2, 0.3, 0.4, 0.2, 0.35]
