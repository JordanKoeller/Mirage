LensingSystem_MicrolensingLens:
  Quasar:
    Redshift: 1.69
    Mass: 1e9 solMass
  Redshift: 0.04
  Cosmology: WMAP7
  Convergence: 0.3
  Shear: 0.0
  StarryFraction: 0.40
Starfield:
  InitialMassFunction: Kroupa2001
  Seed: 110
LensedImageCenter: [0.0, 0.0, 'uas']
RayCount: 500_000_000
SourceRegionDimensions: [100, 100, 'uas']
Reducers:
  - LensedImageAnimationReducer:
      Name: img
      Radius: 1.5 uas
      StartPos: [-20, -36, 'uas']
      EndPos: [20, 36, 'uas']
      Frames: 80
      Resolution: [1000, 1000, '']
