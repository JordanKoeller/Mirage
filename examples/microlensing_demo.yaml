LensingSystem_MicrolensingLens:
  Quasar:
    Redshift: 1.69
    Mass: 1e9 solMass
  Redshift: 0.04
  Cosmology: WMAP7
  Convergence: 0.3
  Shear: 0.0
  StarryFraction: 0.8
Starfield:
  InitialMassFunction: Kroupa2001
  Seed: 110
LensedImageCenter: [0.0, 0.0, 'uas']
RayCount: 20_000_000
SourceRegionDimensions: [60, 60, 'uas']
Reducers:
  - MagnificationMapReducer:
      Name: magmap
      Radius: '${radius} uas'
      Resolution: [512, 512, '']
Variants:
  - LinspaceVariant:
      Name: radius
      Start: 0.2
      Stop: 8
      NumPoints: 2
