LensingSystem_MicrolensingLens:
  Quasar:
    Redshift: 1.69
    Mass: 1e9 solMass
  Redshift: 0.04
  Cosmology: WMAP7
  Convergence: 0.3
  Shear: 0.0
  StarryFraction: 0.2
Starfield:
  InitialMassFunction: Kroupa2001
  Seed: 110
LensedImageCenter: [0.0, 0.0, 'uas']
RayCount: 100_000
SourceRegionDimensions: [60, 60, 'uas']
Reducers:
  - MagnificationMapReducer:
      Name: magmap
      Radius: '${radius} uas'
      Resolution: [100, 100, '']
  - LightCurvesReducer:
      Name: lightcurves
      Radius: '${radius} uas'
      Resolution: 2 1/uas
      NumCurves: 10
      Seed: 12
Variants:
  - LinspaceVariant:
      Name: radius
      Start: 0.2
      Stop: 8
      NumPoints: 8
