LensingSystem_MicrolensingLens:
  Quasar:
    Redshift: 1.69
    Mass: 1e9 solMass
  Redshift: 0.04
  Cosmology: WMAP7
  Convergence: 0.3
  Shear: 0.0
  StarryFraction: '${star_faction}'
Starfield:
  InitialMassFunction: Kroupa2001
  Seed: 110
LensedImageCenter: [0.0, 0.0, 'uas']
RayCount: 16_000_000
SourceRegionDimensions: [60, 60, 'uas']
Reducers:
  - MagnificationMapReducer:
      Name: magmap
      Radius: 0.5 uas
      Resolution: [600, 450, '']
Variants:
  - LinspaceVariant:
      Name: star_faction
      Start: 0.2
      Stop: 0.25
      NumPoints: 5 
