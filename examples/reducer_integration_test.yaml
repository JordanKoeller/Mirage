LensingSystem_MicrolensingLens:
  Quasar:
    Redshift: 1.69
    Mass: 1e9 solMass
  Redshift: 0.04
  Cosmology: WMAP7
  Convergence: 0.4
  Shear: 0.0
  StarryFraction: 0.40
Starfield:
  InitialMassFunction: Kroupa2001
  Seed: 110
LensedImageCenter: [0.0, 0.0, 'uas']
RayCount: 100_000_000
SourceRegionDimensions: [100, 100, 'uas']
Reducers:
  # - LensedImageReducer:
  #     Name: img
  #     Radius: 50 r_g
  #     Query: ['${x_pos}', '${y_pos}', 'uas']
  #     Resolution: [1000, 1000, '']
  - MagnificationMapReducer:
      Name: magmap_pos
      Radius: ${radius} r_g
      Resolution: [1000, 1000, '']
  # - MagnificationMapReducer:
  #     Name: magmap_neg
  #     Radius: 50 r_g
  #     Resolution: [1000, 1000, '']
  #     Parity: -1
  # - MagnificationMapReducer:
  #     Name: magmap_all
  #     Radius: 50 r_g
  #     Resolution: [1000, 1000, '']
  #     Parity: 0
  # - LightCurvesReducer:
  #     Name: curves
  #     Resolution: 2 1/uas
  #     Radius: ${radius} r_g
  #     NumCurves: 10
  #     Seed: 12
Variants:
  - LinspaceVariant:
      Name: radius
      Start: 4
      Stop: 20
      NumPoints: 6
  - LinspaceVariant:
      Name: x_pos
      Start: -20
      Stop: 20
      NumPoints: 20
      Tag: coord
  - LinspaceVariant:
      Name: y_pos
      Start: -36
      Stop: 36
      NumPoints: 20
      Tag: coord
