[project]
name = "mirage"
version = "2.0.0"
description = "Simulating Gravitational Microlensing"
authors = [
  { name = "JordanKoeller", email = "jkoeller12@gmail.com" },
  { name = "DavidPooley", email = "dpooley@trinity.edu" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "dask",
  "dask[distributed]",
  "dask-cloudprovider[aws]",
  "numpy",
  "astropy",
  "bokeh",
  "scipy",
  "maturin",
  "PyYAML",
  "cython",
  "hurry.filesize",
  "pandas",
  "ruamel.yaml",
  "frozendict"
]

[project.optional-dependencies]
dev = [
  "matplotlib",
  "pytest",
  "mockito",
]

[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "mirage"
module-name = "mirage_ext"

[project.urls]
Repo = "https://github.com/jordankoeller/mirage"

[tool.ruff]
line-length = 88
indent-width = 4
lint.ignore = [ 'F403' ]
